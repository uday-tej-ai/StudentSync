<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>

    <!-- Page Specific Head Content -->
    {% block head %}{% endblock %}
</head>
<body>

    <!-- GLOBAL FLASH MESSAGE BLOCK -->
    <!-- This fixes delayed + duplicate flash issues -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash {{ category }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Main Page Content -->
    {% block content %}{% endblock %}

    <style>
        /* =========================
           GLOBAL RESET
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        /* =========================
           USER AVATAR
        ========================= */
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6c5ce7;
        }

        /* =========================
           FLASH CONTAINER
        ========================= */
        .flash-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 450px;
        }

        /* =========================
           FLASH BASE
        ========================= */
        .flash {
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            width: 100%;
            display: block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            animation: slideDown 0.4s ease;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* =========================
           SUCCESS FLASH
        ========================= */
        .success {
            background-color: #e6ffed;
            color: #15803d;
            border: 1px solid #86efac;
        }

        /* =========================
           ERROR FLASH
        ========================= */
        .error {
            background-color: #fff1f2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }

        /* =========================
           INFO FLASH (Optional)
        ========================= */
        .info {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #93c5fd;
        }

        /* =========================
           FLASH ANIMATION
        ========================= */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MOBILE RESPONSIVE
        ========================= */
        @media (max-width: 480px) {
            .flash {
                font-size: 0.9rem;
                padding: 12px;
            }

            .flash-container {
                top: 12px;
                width: 95%;
            }
        }
    </style>

    <script>
        // =========================
        // AUTO REMOVE FLASH MESSAGES
        // =========================
        setTimeout(() => {
            const flashes = document.querySelectorAll('.flash');

            flashes.forEach(flash => {
                flash.style.opacity = "0";
                flash.style.transform = "translateY(-10px)";

                setTimeout(() => {
                    flash.remove();
                }, 500);
            });
        }, 2500);
    </script>

</body>
</html>
