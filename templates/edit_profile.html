{% extends "base.html" %}

{% block head %}
    <title>Edit Profile | Student Portal</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">

    <style>
        /* =========================
           PAGE BACKGROUND
        ========================= */
        body {
            background: linear-gradient(135deg, #f8f9ff, #eef2ff);
            font-family: 'Poppins', sans-serif;
        }

        /* =========================
           MAIN LAYOUT
        ========================= */
        .edit-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* =========================
           CARD
        ========================= */
        .upload-container {
            background: white;
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.12);
            text-align: center;
            width: 100%;
            max-width: 430px;
            animation: fadeUp 0.6s ease;
        }

        /* =========================
           PROFILE ICON
        ========================= */
        .profile-icon {
            font-size: 70px;
            color: #6c5ce7;
            margin-bottom: 15px;
        }

        /* =========================
           HEADINGS
        ========================= */
        .upload-container h2 {
            color: #2d3436;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .user-name {
            color: #6c5ce7;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* =========================
           PREVIEW IMAGE
        ========================= */
        .profile-preview {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ecebff;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        /* =========================
           FILE INPUT
        ========================= */
        .file-input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .custom-file-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: #2d3436;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #dfe6e9;
            border-radius: 14px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #6c5ce7;
            background: #f3f0ff;
        }

        /* =========================
           BUTTON
        ========================= */
        .btn-save {
            background: linear-gradient(135deg, #6c5ce7, #5a4bd1);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2);
        }

        /* =========================
           BACK LINK
        ========================= */
        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #636e72;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #6c5ce7;
        }

        /* =========================
           ANIMATION
        ========================= */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 576px) {
            .upload-container {
                padding: 30px 22px;
            }

            .upload-container h2 {
                font-size: 1.6rem;
            }

            .profile-preview {
                width: 90px;
                height: 90px;
            }
        }
    </style>
{% endblock %}

{% block content %}

<div class="edit-wrapper">

    <div class="upload-container">

        <!-- Icon -->
        <i class="fas fa-user-circle profile-icon"></i>

        <!-- Heading -->
        <h2>Edit Profile</h2>

        <!-- Username -->
        <p class="user-name">Editing for: {{ student }}</p>

        <!-- Current Profile Preview -->
        <img
            src="{{ url_for('static', filename='profile_pics/' + (profile_pic if profile_pic else 'default.png')) }}"
            alt="Profile Preview"
            class="profile-preview"
            id="previewImage"
        >

        <!-- Upload Form -->
        <form action="{{ url_for('upload_profile_pic') }}" method="POST" enctype="multipart/form-data">

            <div class="file-input-group">
                <label class="custom-file-label">
                    Choose New Profile Picture
                </label>

                <input
                    type="file"
                    name="profile_image"
                    accept="image/*"
                    required
                    onchange="previewFile(event)"
                >
            </div>

            <button type="submit" class="btn-save">
                <i class="fas fa-save"></i> Save to Database
            </button>

        </form>

        <!-- Back -->
        <a href="{{ url_for('dashboard') }}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

    </div>

</div>

<script>
    // =========================
    // IMAGE PREVIEW BEFORE UPLOAD
    // =========================
    function previewFile(event) {
        const reader = new FileReader();

        reader.onload = function() {
            const output = document.getElementById('previewImage');
            output.src = reader.result;
        };

        reader.readAsDataURL(event.target.files[0]);
    }
</script>

{% endblock %}
